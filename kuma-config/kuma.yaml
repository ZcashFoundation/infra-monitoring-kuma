# Declarative desired state for the Uptime Kuma instance.
#
# Applied by apply.js over the Socket.IO API (Kuma 2.x has no import/REST).
# Idempotent: entities are matched by name and skipped if they already exist.
# Secrets (webhook URLs, admin password) are NEVER stored here — they come from
# environment variables, which the apply wrapper sources from Secret Manager.

# Tag definitions (name -> colour). Monitors reference tags by name + value.
tags:
  DNS: "#4B5563"
  Network: "#2563EB"
  Org: "#D97706"

# Notification channels. `webhookEnv` names the env var holding the secret URL.
notifications:
  - name: Slack
    type: slack
    # NOT default / applyExisting on purpose: those attach Slack to EVERY monitor
    # including the group containers, so a single child event fires twice (child +
    # group). Each leaf monitor opts in via its own `notifications: [Slack]`, so
    # groups stay silent and you get one Down + one Up.
    default: false
    webhookEnv: SLACK_WEBHOOK_URL
    channel: "#alerts"
    username: "Uptime Kuma"
    iconEmoji: ":robot_face:"
    richMessage: true

# Monitor groups (created first; monitors reference them by name).
groups:
  - DNS Seeders
  - Web Pages

# Monitors. Each declares its own interval/retries so the desired state is
# explicit here, not hidden in defaults. DNS monitors don't declare `timeout`
# because Kuma only uses it for HTTP checks (the applier still sends the default,
# harmlessly). `group` nests under a group; `notifications` attaches channels;
# `tags` are [{name, value}] pairs.
monitors:
  - name: ZFND Mainnet
    group: DNS Seeders
    type: dns
    hostname: mainnet.seeder.zfnd.org
    port: 53
    dns_resolve_type: A
    dns_resolve_server: 1.1.1.1
    interval: 60
    retryInterval: 20
    maxretries: 3
    notifications: [Slack]
    tags:
      - { name: DNS, value: Seeder }
      - { name: Network, value: Mainnet }
      - { name: Org, value: ZFND }

  - name: ZFND Testnet
    group: DNS Seeders
    type: dns
    hostname: testnet.seeder.zfnd.org
    port: 53
    dns_resolve_type: A
    dns_resolve_server: 1.1.1.1
    interval: 60
    retryInterval: 20
    maxretries: 3
    notifications: [Slack]
    tags:
      - { name: DNS, value: Seeder }
      - { name: Network, value: Testnet }
      - { name: Org, value: ZFND }

  - name: ZODL Mainnet
    group: DNS Seeders
    type: dns
    hostname: dnsseed.z.cash
    port: 53
    dns_resolve_type: A
    dns_resolve_server: 1.1.1.1
    interval: 60
    retryInterval: 20
    maxretries: 3
    notifications: [Slack]
    tags:
      - { name: DNS, value: Seeder }
      - { name: Network, value: Mainnet }
      - { name: Org, value: ZODL }

  - name: ZODL Testnet
    group: DNS Seeders
    type: dns
    hostname: dnsseed.testnet.z.cash
    port: 53
    dns_resolve_type: A
    dns_resolve_server: 1.1.1.1
    interval: 60
    retryInterval: 20
    maxretries: 3
    notifications: [Slack]
    tags:
      - { name: DNS, value: Seeder }
      - { name: Network, value: Testnet }
      - { name: Org, value: ZODL }

  - name: Str4d Mainnet
    group: DNS Seeders
    type: dns
    hostname: dnsseed.str4d.xyz
    port: 53
    dns_resolve_type: A
    dns_resolve_server: 1.1.1.1
    interval: 60
    retryInterval: 20
    maxretries: 3
    notifications: [Slack]
    tags:
      - { name: DNS, value: Seeder }
      - { name: Network, value: Mainnet }
      - { name: Org, value: Community }

  # The real seeder health check: the prober handshakes the IPs each nameserver
  # returns and exposes 200/503 at /status (Google Front End reserves /healthz on
  # *.run.app). 503 = a nameserver is serving dead peers -> this monitor goes DOWN.
  # PROBER_BASE_URL is the per-instance Cloud Run URL (dev vs prod), injected at
  # apply time like the other secrets — never hardcoded here.
  - name: DNS Seeder Prober
    group: DNS Seeders
    type: http
    url: ${PROBER_BASE_URL}/status
    method: GET
    interval: 60
    retryInterval: 20
    maxretries: 3
    timeout: 15
    notifications: [Slack]
    tags:
      - { name: DNS, value: Seeder }

  - name: ZFND Web Page
    group: Web Pages
    type: http
    url: https://zfnd.org/
    method: GET
    interval: 60
    retryInterval: 20
    maxretries: 3
    timeout: 15
    expiryNotification: true
    notifications: [Slack]
    tags:
      - { name: Org, value: ZFND }

  - name: Z.CASH Web Page
    group: Web Pages
    type: http
    url: https://z.cash/
    method: GET
    interval: 60
    retryInterval: 20
    maxretries: 3
    timeout: 15
    expiryNotification: true
    notifications: [Slack]
    tags:
      - { name: Org, value: ZFND }

# Public status pages, served without login at /status/<slug>. A page's layout
# is authoritative: on apply, its groups/monitors are replaced by what is
# declared here (pages not listed are never touched). The prober monitor is
# intentionally not exposed — it's an internal signal.
# Adopts the pre-existing "Ecosystem Dashboard" page (slug `dashboard`) rather
# than creating a second one, so its URL and the Entry Page wiring survive.
statusPages:
  - slug: dashboard
    title: Ecosystem Dashboard
    description: Live status of Zcash Foundation public services and DNS seeders.
    showTags: true
    showCertificateExpiry: true
    groups:
      - name: Seeders
        monitors:
          - ZFND Mainnet
          - ZFND Testnet
          - ZODL Mainnet
          - ZODL Testnet
          - Str4d Mainnet
      - name: Web Pages
        monitors:
          - ZFND Web Page
          - Z.CASH Web Page