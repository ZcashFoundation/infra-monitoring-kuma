name: Clean dev instances

on:
  delete:
  pull_request:
    types:
      - closed

permissions: read-all

# Same group as cd-deploy-to-dev.yml, keyed on the branch. A cleanup that fires
# while that branch's preview deploy is still running waits for it instead of
# racing it; otherwise the deploy can create the service right after the cleanup
# found nothing to delete.
concurrency:
  group: dev-preview-${{ github.head_ref || github.event.ref }}
  cancel-in-progress: false

jobs:
  delete:
    # Tag deletions have no preview service.
    if: github.event_name != 'delete' || github.event.ref_type == 'branch'
    runs-on: ubuntu-latest
    permissions:
      contents: 'read'
      id-token: 'write'
    steps:
      - name: Inject slug/short variables
        uses: rlespinasse/github-slug-action@ef93b2ea4b6405d06fd8684fc3ff795d262ecae8 # v5.7.0

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: '${{ vars.GCP_WIF }}'
          project_id: '${{ vars.GCP_PROJECT }}'

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      - name: Removing CR service
        # Expressions go through env (not inline in run) so shell never parses
        # attacker-influenced text — see zizmor's template-injection audit.
        env:
          # On `delete` events GITHUB_REF is the default branch, so GITHUB_REF_SLUG
          # would always name the service after main; the deleted branch is in
          # github.event.ref. Same slug algorithm the deploy uses.
          BRANCH_SLUG: ${{ env.GITHUB_HEAD_REF_SLUG || env.GITHUB_EVENT_REF_SLUG }}
          APP_NAME: ${{ vars.APP_NAME }}
          REGION: ${{ vars.GCP_REGION }}
        run: |
          set -uo pipefail
          if [ -z "$BRANCH_SLUG" ]; then
            echo "::error::could not resolve the branch for this event"
            exit 1
          fi
          SVC="${APP_NAME}-${BRANCH_SLUG}"
          # Only branches that deployed a preview Kuma have a service, so a missing
          # one is expected. Any other describe error (auth, permissions) must fail
          # rather than read as "nothing to clean".
          if out="$(gcloud run services describe "$SVC" --region="$REGION" --format='value(metadata.name)' 2>&1)"; then
            gcloud run services delete "$SVC" --region="$REGION" --quiet
            echo "deleted $SVC"
          elif [[ "$out" == *"Cannot find service"* ]]; then
            echo "no dev service '$SVC' — nothing to clean"
          else
            echo "::error::could not check $SVC: $out"
            exit 1
          fi
