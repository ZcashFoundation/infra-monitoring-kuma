name: Deploy to dev

on:
  pull_request:
    types: [ready_for_review, synchronize]
    paths:
      - '**/Dockerfile'
      - .github/workflows/cd-deploy-to-dev.yml
      - .github/workflows/sub-cloudrun-deploy.yml

concurrency:
  # Keyed on the branch and shared with chore-clean-dev.yml: a newer deploy of the
  # branch cancels the running one, and a cleanup waits for it instead of racing.
  group: dev-preview-${{ github.head_ref }}
  cancel-in-progress: true

permissions:
  actions: read
  attestations: read
  checks: read
  contents: read
  deployments: read
  id-token: write
  issues: read
  discussions: read
  packages: read
  pages: read
  pull-requests: read
  repository-projects: read
  security-events: read
  statuses: read

jobs:
  build:
    uses: ./.github/workflows/sub-build-docker-image.yml
    if: ${{ !github.event.pull_request.draft }}
    with:
      environment: dev
      dockerfile_path: ./docker/Dockerfile
      dockerfile_target: runner
      app_name: ${{ vars.APP_NAME }}
    secrets: inherit

  deploy:
    needs: [build]
    uses: ./.github/workflows/sub-cloudrun-deploy.yml
    with:
      environment: dev
      app_name: ${{ vars.APP_NAME }}
      image_digest: ${{ needs.build.outputs.image_digest }}
      min_instances: '0'
      # Pinned to 1: Kuma is stateful (one monitor loop per instance); >1 would
      # autoscale into duplicate-notification territory.
      max_instances: '1'
      cpu: '1'
      memory: 1Gi
    secrets: inherit
